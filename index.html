<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer Upload Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .portal-container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .portal-header {
            background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .portal-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .portal-header p {
            opacity: 0.85;
            font-size: 15px;
            font-weight: 400;
        }
        .portal-body {
            padding: 30px;
        }
        .trust-badge {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #4a5568;
        }
        .trust-badge span { display: flex; align-items: center; gap: 6px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
            font-size: 14px;
        }
        .form-group input[type="tel"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .form-group input[type="tel"]:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
        }
        .file-drop {
            border: 2px dashed #cbd5e0;
            padding: 30px 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f7fafc;
        }
        .file-drop:hover {
            border-color: #2b6cb0;
            background: #edf2f7;
        }
        .file-drop .icon { font-size: 40px; display: block; margin-bottom: 8px; }
        .file-drop .text { font-weight: 500; color: #2d3748; }
        .file-drop .subtext { font-size: 13px; color: #718096; margin-top: 4px; }
        .file-drop input[type="file"] { display: none; }
        .file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .file-tag {
            background: #edf2f7;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .file-tag .remove {
            color: #fc8181;
            cursor: pointer;
            font-weight: 700;
        }
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-primary {
            background: #f6ad55;
            color: #1a202c;
        }
        .btn-primary:hover {
            background: #ed8936;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(237, 137, 54, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
            width: auto;
            padding: 10px 20px;
        }
        .btn-secondary:hover { background: #cbd5e0; }
        .location-btn {
            background: #48bb78;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .location-btn:hover { background: #38a169; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            background: #1a202c;
            color: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 9999;
            font-weight: 500;
            animation: slideUp 0.3s ease;
        }
        .toast.error { background: #e53e3e; }
        .toast.warning { background: #dd6b20; }
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #2b6cb0;
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        .footer {
            text-align: center;
            color: #a0aec0;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
        }
        .status-banner {
            background: #ebf8ff;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #bee3f8;
            color: #2b6cb0;
            text-align: center;
        }
        @media (max-width: 480px) {
            .portal-header { padding: 30px 20px; }
            .portal-header h1 { font-size: 24px; }
            .portal-body { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- Header -->
        <div class="portal-header">
            <h1>📤 Customer Upload Portal</h1>
            <p>Securely upload your images, videos, and documents</p>
        </div>

        <!-- Body -->
        <div class="portal-body">
            <div class="trust-badge">
                <span>🔒 Secure Upload</span>
                <span>☁️ Cloud Storage</span>
                <span>⚡ Fast Processing</span>
            </div>

            <div class="status-banner">
                ✅ Your files are stored securely and permanently
            </div>

            <form id="uploadForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="mobile">📱 Mobile Number *</label>
                    <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" 
                           pattern="[0-9]{10}" required />
                </div>

                <div class="form-group">
                    <label>📎 Upload Files *</label>
                    <div class="file-drop" onclick="document.getElementById('fileInput').click()">
                        <span class="icon">📁</span>
                        <div class="text">Click to select files</div>
                        <div class="subtext">Images, Videos, PDF, Word (Max 25MB each)</div>
                        <input type="file" id="fileInput" multiple 
                               accept="image/*,video/*,.pdf,.doc,.docx" />
                    </div>
                    <div id="fileList" class="file-list"></div>
                    <div id="fileCount" style="font-size: 13px; color: #718096; margin-top: 6px;"></div>
                </div>

                <div class="form-group">
                    <label>📍 Location (Optional)</label>
                    <button type="button" class="location-btn" onclick="getLocation()">
                        📍 Share My Location
                    </button>
                    <div id="locationDisplay" style="margin-top: 8px; font-size: 14px; color: #4a5568;"></div>
                </div>

                <div class="progress-bar" id="progressBar" style="display:none;">
                    <div class="fill" id="progressFill"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    🚀 Submit
                </button>
            </form>

            <div class="footer">
                Powered by Secure Upload Portal • v2.0
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  🔑 CONFIGURATION - EDIT THESE TWO LINES ONLY!
        // ============================================================
        const IMGBB_API_KEY = 'YOUR_IMGBB_API_KEY_HERE';  // ← Get from https://api.imgbb.com/ (Optional)
        const GITHUB_TOKEN = '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';     // ← Get from https://github.com/settings/tokens (No Expiration!)
        
        // ============================================================
        //  GITHUB SETTINGS (Don't change these)
        // ============================================================
        const GITHUB_OWNER = 'shifajt';
        const GITHUB_REPO = 'customer-upload-portal';
        const GITHUB_BRANCH = 'main';

        // ============================================================
        //  CLOUDINARY SETTINGS (PERMANENT STORAGE!)
        // ============================================================
        const CLOUDINARY_CLOUD_NAME = 'vcr5gfhi';
        const CLOUDINARY_API_KEY = '954166197462943';
        const CLOUDINARY_API_SECRET = 'hkPCj0ACqO1-0wpjt16xc3YXbbY';

        // ============================================================
        //  APP STATE
        // ============================================================
        let selectedFiles = [];
        let userLocation = null;

        // ============================================================
        //  UI FUNCTIONS
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = this.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        function handleFiles(files) {
            const validFiles = [];
            for (let f of files) {
                const isValidType = f.type.startsWith('image/') || 
                                   f.type.startsWith('video/') || 
                                   f.name.endsWith('.pdf') || 
                                   f.name.endsWith('.doc') || 
                                   f.name.endsWith('.docx');
                const isValidSize = f.size <= 25 * 1024 * 1024;
                if (isValidType && isValidSize) {
                    validFiles.push(f);
                }
            }
            if (validFiles.length !== files.length) {
                showToast('Some files were skipped. Only images, videos, PDFs, and Word docs under 25MB allowed.', 'error');
            }
            selectedFiles = [...selectedFiles, ...validFiles];
            renderFileList();
        }

        function renderFileList() {
            const container = document.getElementById('fileList');
            const countDisplay = document.getElementById('fileCount');
            if (selectedFiles.length === 0) {
                container.innerHTML = '';
                countDisplay.textContent = '';
                return;
            }
            container.innerHTML = selectedFiles.map((f, i) => `
                <span class="file-tag">
                    📎 ${f.name} (${(f.size/1024).toFixed(1)} KB)
                    <span class="remove" onclick="removeFile(${i})">✕</span>
                </span>
            `).join('');
            countDisplay.textContent = `${selectedFiles.length} file(s) selected (${(selectedFiles.reduce((a,b) => a + b.size, 0)/1024/1024).toFixed(1)} MB total)`;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        function getLocation() {
            if (!navigator.geolocation) {
                showToast('Geolocation not supported by this browser', 'error');
                document.getElementById('locationDisplay').innerHTML = '❌ Geolocation not supported';
                return;
            }
            
            document.getElementById('locationDisplay').innerHTML = '⏳ Getting location...';
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLocation = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    };
                    document.getElementById('locationDisplay').innerHTML = 
                        `✅ Location: ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}`;
                    showToast('📍 Location shared successfully!');
                },
                (error) => {
                    console.error('Location error:', error);
                    let msg = 'Unable to get location. ';
                    if (error.code === 1) msg += 'Please allow location access.';
                    else if (error.code === 2) msg += 'Location unavailable.';
                    else if (error.code === 3) msg += 'Location request timed out.';
                    showToast(msg, 'error');
                    document.getElementById('locationDisplay').innerHTML = `❌ ${msg}`;
                }
            );
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // ============================================================
        //  UPLOAD TO CLOUDINARY (PERMANENT!)
        // ============================================================
        async function uploadToCloudinary(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const base64 = e.target.result.split(',')[1];
                        const formData = new FormData();
                        formData.append('file', `data:${file.type};base64,${base64}`);
                        formData.append('upload_preset', 'ml_default');
                        formData.append('api_key', CLOUDINARY_API_KEY);
                        
                        const response = await fetch(
                            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                            { method: 'POST', body: formData }
                        );
                        const data = await response.json();
                        if (data.secure_url) {
                            resolve({
                                name: file.name,
                                type: file.type,
                                size: file.size,
                                url: data.secure_url,
                                cloud: true,
                                public_id: data.public_id
                            });
                        } else {
                            reject(new Error('Upload failed'));
                        }
                    } catch (error) { reject(error); }
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================================================
        //  GITHUB STORAGE
        // ============================================================
        async function loadFromGitHub() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/uploads.json`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    const content = atob(data.content);
                    return { data: JSON.parse(content), sha: data.sha };
                } else if (response.status === 404) {
                    return { data: [], sha: null };
                } else {
                    throw new Error('Failed to load data from GitHub');
                }
            } catch (e) {
                console.error('GitHub load error:', e);
                const localData = localStorage.getItem('uploads');
                return { data: localData ? JSON.parse(localData) : [], sha: null };
            }
        }

        async function saveToGitHub(data, sha) {
            try {
                const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/uploads.json`;
                const body = {
                    message: `Update uploads - ${new Date().toISOString()}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                    branch: GITHUB_BRANCH
                };
                if (sha) body.sha = sha;
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(body)
                });
                if (!response.ok) throw new Error('Failed to save to GitHub');
                localStorage.setItem('uploads', JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('GitHub save error:', e);
                localStorage.setItem('uploads', JSON.stringify(data));
                showToast('⚠️ Saved locally only (GitHub sync failed)', 'warning');
                return false;
            }
        }

        // ============================================================
        //  SUBMIT HANDLER
        // ============================================================
        async function handleSubmit(e) {
            e.preventDefault();
            const mobile = document.getElementById('mobile').value.trim();
            if (!mobile || mobile.length !== 10) {
                showToast('Please enter a valid 10-digit mobile number', 'error');
                return;
            }
            if (selectedFiles.length === 0) {
                showToast('Please select at least one file', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            btn.disabled = true;
            btn.textContent = '⏳ Uploading to Cloud...';
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            try {
                const totalFiles = selectedFiles.length;
                const uploadedFiles = [];
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const percent = ((i) / totalFiles) * 100;
                    progressFill.style.width = percent + '%';
                    btn.textContent = `⏳ Uploading ${i+1}/${totalFiles}...`;

                    if (file.type.startsWith('image/')) {
                        try {
                            const result = await uploadToCloudinary(file);
                            uploadedFiles.push(result);
                        } catch (err) {
                            console.error('Cloudinary upload failed:', err);
                            const dataUrl = await readFileAsDataURL(file);
                            uploadedFiles.push({
                                name: file.name,
                                type: file.type,
                                size: file.size,
                                data: dataUrl,
                                cloud: false
                            });
                        }
                    } else {
                        const dataUrl = await readFileAsDataURL(file);
                        uploadedFiles.push({
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            data: dataUrl,
                            cloud: false
                        });
                    }
                }

                progressFill.style.width = '100%';
                btn.textContent = '💾 Saving...';
                const { data: existingData, sha } = await loadFromGitHub();
                const upload = {
                    id: Date.now().toString(),
                    mobile: mobile,
                    files: uploadedFiles,
                    location: userLocation,
                    timestamp: new Date().toISOString(),
                    viewed: false
                };
                existingData.unshift(upload);
                await saveToGitHub(existingData, sha);

                // Reset form
                selectedFiles = [];
                userLocation = null;
                document.getElementById('mobile').value = '';
                document.getElementById('fileList').innerHTML = '';
                document.getElementById('fileCount').textContent = '';
                document.getElementById('locationDisplay').innerHTML = '';
                document.getElementById('fileInput').value = '';

                showToast('✅ Upload successful! Stored permanently.');
            } catch (err) {
                console.error('Upload error:', err);
                showToast('❌ Upload failed: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Submit';
                progressBar.style.display = 'none';
                progressFill.style.width = '0%';
            }
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsDataURL(file);
            });
        }

        window.onload = function() {
            console.log('📤 Customer Upload Portal loaded!');
            console.log('☁️ Cloudinary configured for PERMANENT storage!');
        };
    </script>
</body>
</html>
